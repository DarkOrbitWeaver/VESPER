<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VESPER Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/vesper-48.png" alt="" width="28" height="28">
    <h1>VESPER <span>Settings</span></h1>
  </header>
  <main>
    <label class="setting"><span>Appearance</span>
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <label class="setting"><span>Butterfly motion</span>
      <select id="motion">
        <option value="animate">Animate</option>
        <option value="still">Off</option>
      </select>
    </label>
    <label class="setting"><span>Browser downloads</span>
      <select id="browser-downloads">
        <option value="automatic">Send to VESPER automatically</option>
        <option value="manual">Send from right-click menu</option>
        <option value="chrome">Save with Chrome</option>
      </select>
    </label>
    <small id="manual-downloads" hidden>Right-click a link and choose <strong>Download with VESPER</strong>.</small>
    <label class="setting" id="handoff-setting"><span>After sending a file</span>
      <select id="handoff">
        <option value="download">Download now</option>
        <option value="queue">Queue</option>
      </select>
    </label>
    <p id="first-run" class="hint" hidden>Chrome keeps downloads it has already started.</p>
    <details id="site-sign-in">
      <summary>Site sign-in</summary>
      <label class="check"><input type="checkbox" id="signin" disabled><span>Use my Chrome sign-in<small id="signin-access"></small></span></label>
      <button id="signin-permission" class="vesper-button" type="button" hidden>Allow Chrome sign-in access</button>
      <details id="file-sign-in" hidden>
        <summary>Files that require sign-in</summary>
        <label class="check"><input type="checkbox" id="signin-site" disabled><span>Allow file sign-in on <strong id="signin-host">this site</strong><small id="signin-site-hint">Turn this on if the file requires your account.</small></span></label>
      </details>
    </details>
    <details>
      <summary>Video picker</summary>
      <label class="check"><input type="checkbox" id="prefetch"><span>Find video formats early<small>Start checking formats before you open the butterfly.</small></span></label>
    </details>
    <details id="recent" hidden>
      <summary>Recent capture results</summary>
      <ul id="decisions"></ul>
      <p id="recent-result" class="result" role="status"></p>
    </details>
    <small id="version" class="version"></small>
  </main>
  <script src="theme.js"></script>
  <script src="capture-reasons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
