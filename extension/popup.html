<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VESPER Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/vesper-48.png" alt="" width="28" height="28">
    <h1>VESPER <span>Settings</span></h1>
  </header>
  <main>
    <label class="setting"><span>Appearance</span>
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <label class="setting"><span>Butterfly motion</span>
      <select id="motion" aria-describedby="motion-hint">
        <option value="system">Follow system</option>
        <option value="animate">Always animate</option>
        <option value="still">No animation</option>
      </select>
    </label>
    <small id="motion-hint" class="hint">Follow system respects your reduced-motion setting.</small>
    <label class="setting"><span>When Chrome sends a file</span>
      <select id="handoff">
        <option value="download">Download now</option>
        <option value="queue">Queue</option>
        <option value="default">Follow VESPER</option>
      </select>
    </label>
    <label class="setting"><span>Download connection</span>
      <select id="route">
        <option value="auto">Automatic</option>
        <option value="chrome">Keep Chrome’s connection</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="intercept"><span>Capture downloads automatically</span></label>
    <label class="check"><input type="checkbox" id="signin" disabled><span>Use site sign-in <small id="signin-access">Chrome permission required.</small></span></label>
  </main>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
