<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VESPER</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/vesper-48.png" alt="" width="28" height="28">
    <h1>VESPER <span id="header-sub">Ready</span></h1>
  </header>
  <main>
    <label class="check pause"><input type="checkbox" id="pause-vesper" disabled><span>Pause VESPER in Chrome<small>Hide the butterfly and keep new downloads in Chrome.</small></span></label>
    <button id="site-butterfly" class="text-action" type="button" disabled>Hide butterfly on this site</button>
    <small id="site-butterfly-host" class="site-host"></small>
    <label class="setting"><span>Appearance</span>
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <label class="setting"><span>Butterfly motion</span>
      <select id="motion">
        <option value="animate">Animate</option>
        <option value="still">Off</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="signin" disabled><span>Use my Chrome sign-in<small id="signin-access" role="status"></small></span></label>
    <button id="signin-permission" class="action-btn" type="button" hidden>Allow Chrome sign-in access</button>
    <small id="settings-status" class="result" role="status" hidden></small>
    <footer class="version">
      <button id="copy-diagnostics" class="text-action" type="button">Copy failure log</button>
      <small id="version"></small>
    </footer>
  </main>
  <script src="theme.js"></script>
  <script src="browser-preferences.js"></script>
  <script src="popup.js"></script>
</body>
</html>
